<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alerta Time Wetzel</title>
<style>
  :root{
    --red:#c81e1e;
    --red-dark:#7a1013;
    --gold:#ffc72c;
    --gray-bg:#e9e9e9;
    --border:#d8d8d8;
    --bg:#f2f2f2;
    --panel-bg:#ffffff;
    --text:#222222;
    --text-secondary:#767070;
    --input-bg:#ffffff;
    --input-border:#cccccc;
    --btn-secondary-bg:#eeeeee;
    --btn-secondary-bg-hover:#dddddd;
    --canvas-shadow:rgba(0,0,0,.08);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --gray-bg:#2a2424;
      --border:#443c3c;
      --bg:#171313;
      --panel-bg:#221d1d;
      --text:#f2ece9;
      --text-secondary:#b3a29e;
      --input-bg:#2a2424;
      --input-border:#4d4444;
      --btn-secondary-bg:#332c2c;
      --btn-secondary-bg-hover:#3e3535;
      --canvas-shadow:rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"]{
    --gray-bg:#2a2424;
    --border:#443c3c;
    --bg:#171313;
    --panel-bg:#221d1d;
    --text:#f2ece9;
    --text-secondary:#b3a29e;
    --input-bg:#2a2424;
    --input-border:#4d4444;
    --btn-secondary-bg:#332c2c;
    --btn-secondary-bg-hover:#3e3535;
    --canvas-shadow:rgba(0,0,0,.4);
  }
  *{box-sizing:border-box;}
  html, body{
    height:100vh;
    height:100dvh;
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:var(--bg);
    color:var(--text);
    overflow:hidden;
  }
  @media (max-width:800px), (max-height:600px){
    html, body{ height:auto; overflow:auto; }
  }
  header{
    background:var(--red);
    color:#fff;
    padding:12px 24px;
    font-size:18px;
    font-weight:bold;
    height:46px;
    box-sizing:border-box;
    display:flex;
    align-items:center;
  }
  .wrap{
    display:flex;
    flex-wrap:nowrap;
    gap:20px;
    padding:16px;
    height:calc(100% - 46px);
    overflow:hidden;
  }
  @media (max-width:800px), (max-height:600px){
    .wrap{ flex-wrap:wrap; height:auto; overflow:visible; }
  }
  .panel{
    background:var(--panel-bg);
    border:1px solid var(--border);
    border-radius:10px;
    padding:18px;
    flex:0 0 360px;
    max-width:360px;
    height:100%;
    overflow-y:auto;
  }
  @media (max-width:800px), (max-height:600px){
    .panel{ flex:1 1 100%; max-width:100%; height:auto; overflow:visible; }
  }
  .panel h2{
    margin-top:0;
    font-size:16px;
    color:var(--red);
  }
  label{
    display:block;
    font-size:13px;
    font-weight:bold;
    margin:12px 0 4px;
    color:var(--text);
  }
  input[type=text], textarea, select{
    width:100%;
    padding:8px 10px;
    border:1px solid var(--input-border);
    border-radius:6px;
    font-size:14px;
    font-family:inherit;
    background:var(--input-bg);
    color:var(--text);
  }
  textarea{ resize:vertical; min-height:50px; }
  .row3{ display:flex; gap:10px; }
  .row3 > div{ flex:1; }
  .imgbtn{
    display:inline-block;
    margin-top:8px;
    padding:8px 14px;
    background:var(--red);
    color:#fff;
    border:none;
    border-radius:6px;
    font-size:13px;
    cursor:pointer;
  }
  .imgbtn:hover{ background:var(--red-dark); }
  #thumbs{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:10px;
  }
  .thumb{
    position:relative;
    width:60px;
    height:60px;
    border:1px solid var(--border);
    border-radius:6px;
    overflow:hidden;
  }
  .thumb img{ width:100%; height:100%; object-fit:cover; }
  .thumb button{
    position:absolute;
    top:2px; right:2px;
    background:rgba(0,0,0,.6);
    color:#fff;
    border:none;
    border-radius:50%;
    width:18px; height:18px;
    font-size:11px;
    line-height:1;
    cursor:pointer;
  }
  .actions{
    margin-top:16px;
    display:flex;
    gap:10px;
  }
  .btn{
    padding:10px 18px;
    border:none;
    border-radius:6px;
    font-size:14px;
    cursor:pointer;
    font-weight:bold;
  }
  .btn-primary{ background:var(--red); color:#fff; }
  .btn-primary:hover{ background:var(--red-dark); }
  .btn-secondary{ background:var(--btn-secondary-bg); color:var(--text); }
  .btn-secondary:hover{ background:var(--btn-secondary-bg-hover); }
  .preview{
    flex:1 1 auto;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    min-width:0;
  }
  @media (max-width:800px), (max-height:600px){
    .preview{ flex:1 1 100%; width:100%; height:auto; overflow:visible; padding:8px 0 24px; }
  }
  #outputCanvas{
    max-width:100%;
    max-height:100%;
    border:1px solid var(--border);
    border-radius:10px;
    background:#fff;
    box-shadow:0 2px 10px var(--canvas-shadow);
    display:block;
  }
  .hint{ font-size:12px; color:var(--text-secondary); }
</style>
</head>
<body>

<header>Gerador de Notificação de Reclamação — Padrão Fábrica</header>

<div class="wrap">

  <div class="panel">
    <h2>Dados da Reclamação</h2>

    <label for="cliente">Cliente</label>
    <select id="cliente">
      <option value="">Selecione...</option>
      <option>AAM</option>
      <option>GM</option>
      <option>MWM</option>
      <option>ZF</option>
      <option>EATON</option>
      <option>SCANIA</option>
      <option>MBB</option>
      <option>VOLVO</option>
      <option value="__outro__">Outro (digitar)</option>
    </select>
    <input type="text" id="clienteOutro" placeholder="Digite o nome do cliente" style="display:none; margin-top:8px;">

    <label for="pn">Part Number (PN)</label>
    <input type="text" id="pn" placeholder="Ex: 2565">

    <label>Imagens do Defeito (até 4)</label>
    <input type="file" id="fileInput" accept="image/*" multiple style="display:none">
    <button type="button" class="imgbtn" onclick="document.getElementById('fileInput').click()">Selecionar imagens</button>
    <div id="thumbs"></div>

    <div class="row3">
      <div>
        <label for="rastreio">Rastreabilidade Usinado</label>
        <input type="text" id="rastreio" placeholder="0046 / 0082 / 0092">
      </div>
      <div>
        <label for="turno">Turno</label>
        <input type="text" id="turno" placeholder="T1">
      </div>
    </div>

    <label for="datador">Datador de Bruto</label>
    <input type="text" id="datador" placeholder="24/03/2026">

    <div class="row3">
      <div>
        <label for="responsavel">Responsável pelas Informações</label>
        <input type="text" id="responsavel" placeholder="Nome do responsável">
      </div>
      <div>
        <label for="localEncontrado">Local Encontrado</label>
        <input type="text" id="localEncontrado" placeholder="Ex: Linha de Usinagem 3">
      </div>
    </div>

    <label for="defeito">Descrição do Defeito</label>
    <textarea id="defeito" placeholder="Ex: AUSÊNCIA DE MOLIBDÊNIO"></textarea>

    <div class="actions">
      <button class="btn btn-primary" onclick="renderCard()">Gerar Imagem</button>
      <button class="btn btn-secondary" onclick="downloadImage()">Baixar PNG</button>
    </div>
    <p class="hint">A prévia atualiza automaticamente enquanto você digita.</p>
  </div>

  <div class="preview">
    <canvas id="outputCanvas" width="1000" height="1200"></canvas>
  </div>

</div>

const uploadedImages = []; // {img: HTMLImageElement, url: string}

const wetzelLogo = new Image();
wetzelLogo.onload = () => renderCard();
wetzelLogo.src = 'data:image/png;base64,' + WETZEL_LOGO_B64;

document.getElementById('fileInput').addEventListener('change', (e) => {
  const files = Array.from(e.target.files).slice(0, 4 - uploadedImages.length);
  files.forEach(file => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      uploadedImages.push({ img, url });
      renderThumbs();
      renderCard();
    };
    img.onerror = () => {
      URL.revokeObjectURL(url);
      alert(`Não foi possível carregar a imagem "${file.name}". O formato pode não ser suportado pelo navegador (tente salvar como JPG ou PNG).`);
    };
    img.src = url;
  });
  e.target.value = '';
});

document.getElementById('cliente').addEventListener('change', (e) => {
  const outro = document.getElementById('clienteOutro');
  outro.style.display = e.target.value === '__outro__' ? 'block' : 'none';
  renderCard();
});

['clienteOutro','pn','rastreio','turno','datador','responsavel','localEncontrado','defeito'].forEach(id => {
  document.getElementById(id).addEventListener('input', renderCard);
});

function getClienteValue(){
  const sel = document.getElementById('cliente');
  if (sel.value === '__outro__') return document.getElementById('clienteOutro').value || '—';
  return sel.value || '—';
}

function renderThumbs(){
  const box = document.getElementById('thumbs');
  box.innerHTML = '';
  uploadedImages.forEach((entry, i) => {
    const div = document.createElement('div');
    div.className = 'thumb';
    div.innerHTML = `<img src="${entry.url}"><button type="button" onclick="removeImage(${i})">×</button>`;
    box.appendChild(div);
  });
}

function removeImage(i){
  uploadedImages.splice(i, 1);
  renderThumbs();
  renderCard();
}

function getTodayFormatted(){
  const d = new Date();
  const dd = String(d.getDate()).padStart(2, '0');
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  return `${dd}/${mm}/${d.getFullYear()}`;
}

function roundRect(ctx, x, y, w, h, r){
  if (typeof r === 'number') r = {tl:r, tr:r, br:r, bl:r};
  ctx.beginPath();
  ctx.moveTo(x + r.tl, y);
  ctx.lineTo(x + w - r.tr, y);
  ctx.arcTo(x + w, y, x + w, y + r.tr, r.tr);
  ctx.lineTo(x + w, y + h - r.br);
  ctx.arcTo(x + w, y + h, x + w - r.br, y + h, r.br);
  ctx.lineTo(x + r.bl, y + h);
  ctx.arcTo(x, y + h, x, y + h - r.bl, r.bl);
  ctx.lineTo(x, y + r.tl);
  ctx.arcTo(x, y, x + r.tl, y, r.tl);
  ctx.closePath();
}

function drawImageCover(ctx, img, x, y, w, h){
  const scale = Math.max(w / img.width, h / img.height);
  const sw = w / scale, sh = h / scale;
  const sx = (img.width - sw) / 2, sy = (img.height - sh) / 2;
  ctx.save();
  roundRect(ctx, x, y, w, h, 8);
  ctx.clip();
  ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
  ctx.restore();
}

function fitTextToWidth(ctx, text, cx, baseline, maxWidth, baseSize, font, weight){
  weight = weight === undefined ? 'bold' : weight;
  let size = baseSize;
  ctx.font = `${weight} ${size}px ${font}`.trim();
  while (ctx.measureText(text).width > maxWidth && size > 12) {
    size -= 2;
    ctx.font = `${weight} ${size}px ${font}`.trim();
  }
  ctx.fillText(text, cx, baseline);
}

function wrapAndFitText(ctx, text, x, y, maxWidth, maxHeight, baseSize, font){
  let size = baseSize;
  let lines;
  do {
    ctx.font = `${size}px ${font}`;
    lines = [];
    let words = text.split(' ');
    let line = '';
    words.forEach(word => {
      const test = line ? line + ' ' + word : word;
      if (ctx.measureText(test).width > maxWidth && line) {
        lines.push(line);
        line = word;
      } else {
        line = test;
      }
    });
    if (line) lines.push(line);
    size -= 2;
  } while ((lines.length * (size + 2 + 6) > maxHeight) && size > 10);
  size += 2;
  ctx.font = `bold ${size}px ${font}`;
  const lineHeight = size + 6;
  const totalHeight = lines.length * lineHeight;
  let startY = y + (maxHeight - totalHeight) / 2 + size;
  lines.forEach(line => {
    ctx.fillText(line, x, startY);
    startY += lineHeight;
  });
}

function renderCard(){
  const canvas = document.getElementById('outputCanvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const FONT = 'Arial, Helvetica, sans-serif';
  const RED = '#c81e1e';
  const RED_DARK = '#7a1013';
  const GOLD = '#ffc72c';

  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0,0,W,H);

  const pad = 36;
  let y = 0;

  // ---- Header ----
  const headerH = 150;
  ctx.save();
  roundRect(ctx, 0, 0, W, headerH, {tl:24, tr:24, br:0, bl:0});
  ctx.clip();

  const grad = ctx.createLinearGradient(0, 0, W, headerH);
  grad.addColorStop(0, RED_DARK);
  grad.addColorStop(1, RED);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, headerH);

  // dynamic diagonal accent stripes
  ctx.fillStyle = 'rgba(255,255,255,0.07)';
  for (let i = 0; i < 5; i++) {
    const xOff = W * 0.5 + i * 66;
    ctx.beginPath();
    ctx.moveTo(xOff, 0);
    ctx.lineTo(xOff + 34, 0);
    ctx.lineTo(xOff + 34 - 60, headerH);
    ctx.lineTo(xOff - 60, headerH);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();

  // icon circle with soft shadow
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.25)';
  ctx.shadowBlur = 12;
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(90, 75, 46, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();

  ctx.font = '52px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('📣', 90, 80);

  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';

  const titleX = 160;
  const titleMaxWidth = W - pad - titleX;
  const titlePart1 = 'ATENÇÃO, ';
  const titlePart2 = 'TIME WETZEL!';
  let titleSize = 44;
  let w1, w2;
  do {
    ctx.font = `bold ${titleSize}px ${FONT}`;
    w1 = ctx.measureText(titlePart1).width;
    ctx.font = `italic bold ${titleSize}px ${FONT}`;
    w2 = ctx.measureText(titlePart2).width;
    if (w1 + w2 <= titleMaxWidth) break;
    titleSize -= 2;
  } while (titleSize > 20);

  const titleBaseline = 92;
  ctx.fillStyle = '#ffffff';
  ctx.font = `bold ${titleSize}px ${FONT}`;
  ctx.fillText(titlePart1, titleX, titleBaseline);
  ctx.fillStyle = GOLD;
  ctx.font = `italic bold ${titleSize}px ${FONT}`;
  ctx.fillText(titlePart2, titleX + w1, titleBaseline);

  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 22px ' + FONT;
  ctx.textAlign = 'right';
  ctx.fillText(getTodayFormatted(), W - pad, headerH - 22);
  ctx.textAlign = 'left';

  y = headerH + 20;

  // ---- Reclamação Cliente tag ----
  ctx.font = '900 46px ' + FONT;
  try { ctx.letterSpacing = '3px'; } catch(e) {}
  const tagText = 'RECLAMAÇÃO CLIENTE';
  const tagPadX = 40;
  const tagW = ctx.measureText(tagText).width + tagPadX * 2;
  const tagH = 84;
  const tagX = W/2 - tagW/2;

  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.35)';
  ctx.shadowBlur = 20;
  ctx.shadowOffsetY = 6;
  roundRect(ctx, tagX, y, tagW, tagH, tagH/2);
  ctx.fillStyle = RED;
  ctx.fill();
  ctx.restore();

  roundRect(ctx, tagX, y, tagW, tagH, tagH/2);
  ctx.lineWidth = 5;
  ctx.strokeStyle = GOLD;
  ctx.stroke();

  ctx.fillStyle = '#ffffff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(tagText, W/2, y + tagH/2 + 2);
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  try { ctx.letterSpacing = '0px'; } catch(e) {}

  y += tagH + 28;

  // ---- Cliente / PN row ----
  const rowH = 130;
  const boxGap = 20;
  const boxW = (W - pad*2 - boxGap) / 2;

  ctx.strokeStyle = '#cfcfcf';
  ctx.lineWidth = 2;
  roundRect(ctx, pad, y, boxW, rowH, 10);
  ctx.stroke();
  roundRect(ctx, pad + boxW + boxGap, y, boxW, rowH, 10);
  ctx.stroke();

  ctx.fillStyle = '#222';
  ctx.font = 'bold 20px ' + FONT;
  ctx.textAlign = 'left';
  ctx.fillText('CLIENTE:', pad + 20, y + 28);
  ctx.fillText('PN:', pad + boxW + boxGap + 20, y + 28);

  const cliente = getClienteValue();
  const pn = document.getElementById('pn').value || '—';

  ctx.textAlign = 'center';
  fitTextToWidth(ctx, cliente, pad + boxW/2, y + 98, boxW - 40, 58, FONT);
  fitTextToWidth(ctx, pn, pad + boxW + boxGap + boxW/2, y + 98, boxW - 40, 58, FONT);
  ctx.textAlign = 'left';

  y += rowH + 26;

  // ---- Image box (dashed red border) ----
  const imgBoxH = 420;
  ctx.save();
  ctx.strokeStyle = RED;
  ctx.lineWidth = 3;
  ctx.setLineDash([10, 8]);
  roundRect(ctx, pad, y, W - pad*2, imgBoxH, 14);
  ctx.stroke();
  ctx.restore();

  const innerPad = 14;
  const ix = pad + innerPad, iy = y + innerPad;
  const iw = W - pad*2 - innerPad*2, ih = imgBoxH - innerPad*2;

  if (uploadedImages.length === 0) {
    ctx.fillStyle = '#999';
    ctx.font = '22px ' + FONT;
    ctx.textAlign = 'center';
    ctx.fillText('Nenhuma imagem selecionada', W/2, y + imgBoxH/2);
    ctx.textAlign = 'left';
  } else {
    const gap = 10;
    const n = uploadedImages.length;
    const slotW = (iw - gap*(n-1)) / n;
    uploadedImages.forEach((entry, i) => {
      if (entry.img.complete && entry.img.naturalWidth) {
        drawImageCover(ctx, entry.img, ix + i*(slotW+gap), iy, slotW, ih);
      }
    });
  }

  y += imgBoxH + 30;

  // ---- 3 column info row ----
  const col3Gap = 20;
  const col3W = (W - pad*2 - col3Gap*2) / 3;
  const labelH = 26;
  const col3BoxH = 74;

  const rastreio = document.getElementById('rastreio').value || '—';
  const turno = document.getElementById('turno').value || '—';
  const datador = document.getElementById('datador').value || '—';

  const cols = [
    { label: 'Rastreabilidade Usinado', value: rastreio },
    { label: 'Turno', value: turno },
    { label: 'Datador de Bruto', value: datador },
  ];

  cols.forEach((col, i) => {
    const cx = pad + i*(col3W + col3Gap);
    ctx.fillStyle = '#222';
    ctx.font = 'bold 18px ' + FONT;
    ctx.textAlign = 'center';
    ctx.fillText(col.label, cx + col3W/2, y + labelH - 4);

    ctx.strokeStyle = '#cfcfcf';
    ctx.lineWidth = 2;
    roundRect(ctx, cx, y + labelH, col3W, col3BoxH, 8);
    ctx.stroke();

    ctx.font = '20px ' + FONT;
    ctx.fillText(col.value, cx + col3W/2, y + labelH + col3BoxH/2 + 7);
  });
  ctx.textAlign = 'left';

  y += labelH + col3BoxH + 34;

  // ---- Responsável / Local Encontrado row ----
  const col2Gap = 20;
  const col2W = (W - pad*2 - col2Gap) / 2;

  const responsavel = document.getElementById('responsavel').value || '—';
  const localEncontrado = document.getElementById('localEncontrado').value || '—';

  const cols2 = [
    { label: 'Responsável pelas Informações', value: responsavel },
    { label: 'Local Encontrado', value: localEncontrado },
  ];

  cols2.forEach((col, i) => {
    const cx = pad + i*(col2W + col2Gap);
    ctx.fillStyle = '#222';
    ctx.font = 'bold 18px ' + FONT;
    ctx.textAlign = 'center';
    ctx.fillText(col.label, cx + col2W/2, y + labelH - 4);

    ctx.strokeStyle = '#cfcfcf';
    ctx.lineWidth = 2;
    roundRect(ctx, cx, y + labelH, col2W, col3BoxH, 8);
    ctx.stroke();

    fitTextToWidth(ctx, col.value, cx + col2W/2, y + labelH + col3BoxH/2 + 7, col2W - 30, 20, FONT, '');
  });
  ctx.textAlign = 'left';

  y += labelH + col3BoxH + 34;

  // ---- Descrição do Defeito ----
  ctx.fillStyle = '#222';
  ctx.font = 'bold 20px ' + FONT;
  ctx.fillText('Descrição do Defeito', pad, y + 20);

  y += 34;
  const defeitoBoxH = 130;
  ctx.fillStyle = '#e9e9e9';
  roundRect(ctx, pad, y, W - pad*2, defeitoBoxH, 8);
  ctx.fill();

  const defeito = (document.getElementById('defeito').value || '—').toUpperCase();
  ctx.fillStyle = '#222';
  ctx.textAlign = 'center';
  wrapAndFitText(ctx, defeito, W/2, y, W - pad*2 - 40, defeitoBoxH, 30, FONT);
  ctx.textAlign = 'left';

  y += defeitoBoxH + 30;

  // ---- Footer: Wetzel Automotiva branding ----
  ctx.strokeStyle = '#e5e5e5';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(pad, y);
  ctx.lineTo(W - pad, y);
  ctx.stroke();

  y += 22;
  const logoH = 80;
  if (wetzelLogo.complete && wetzelLogo.naturalWidth) {
    const logoW = logoH * (wetzelLogo.naturalWidth / wetzelLogo.naturalHeight);
    ctx.drawImage(wetzelLogo, W/2 - logoW/2, y, logoW, logoH);
  }
  y += logoH + 16;

  ctx.fillStyle = '#888888';
  ctx.font = '17px ' + FONT;
  ctx.textAlign = 'center';
  ctx.fillText('Avenida Magal, 261 - Jardim Amanda II, Resende - SP, 13190-000', W/2, y);
  ctx.textAlign = 'left';

  y += pad;

  if (canvas.height !== y) {
    canvas.height = y;
    renderCard();
  }
}

function fallbackDownload(canvas, filename){
  const link = document.createElement('a');
  link.download = filename;
  link.href = canvas.toDataURL('image/png');
  link.click();
}

async function downloadImage(){
  renderCard();

  const canvas = document.getElementById('outputCanvas');
  const cliente = (getClienteValue() || 'cliente').trim().replace(/\s+/g, '_');
  const pn = (document.getElementById('pn').value || 'pn').trim().replace(/\s+/g, '_');
  const filename = `reclamacao_${cliente}_${pn}.png`;

  const downloads = window.claude ? await window.claude.use('downloads').catch(() => null) : null;
  if (!downloads) {
    fallbackDownload(canvas, filename);
    return;
  }

  canvas.toBlob(async (blob) => {
    try {
      await downloads.save({ filename, data: blob });
    } catch (err) {
      if (!err || err.code !== 'declined') {
        fallbackDownload(canvas, filename);
      }
    }
  }, 'image/png');
}

// initial render
renderCard();
</script>
